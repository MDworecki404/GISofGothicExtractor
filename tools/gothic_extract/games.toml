# Paths are relative to the project folder (parent of tools/).

[g2nk]
root = "Gothic II"
version = "GOTHIC2"
vdf_glob = "Data/*.vdf"
vdf_exclude = ["Speech*", "Sounds*"]
script_dat = "_work/Data/Scripts/_compiled/GOTHIC.DAT"
anchor = { lon = 0.0, lat = 0.0, h = 0.0 }

# Script entry points per world (fnmatch patterns). Inserts reachable only from
# another world's entry points are excluded from a world's output.
[g2nk.world_roots]
NEWWORLD = ["STARTUP_NEWWORLD", "INIT_NEWWORLD", "B_ENTER_NEWWORLD*"]
OLDWORLD = ["STARTUP_OLDWORLD", "INIT_OLDWORLD", "B_ENTER_OLDWORLD*"]
ADDONWORLD = ["STARTUP_ADDONWORLD", "INIT_ADDONWORLD", "B_ENTER_ADDONWORLD*"]
DRAGONISLAND = ["STARTUP_DRAGONISLAND", "INIT_DRAGONISLAND", "B_ENTER_DRAGONISLAND*", "ENTER_DI_*"]

# Chapter in which the player first reaches a world. Inserts outside any chapter function (world
# startup, dialogs, events) cannot happen earlier, so they get this chapter.
[g2nk.first_chapter]
OLDWORLD = 2
ADDONWORLD = 3
DRAGONISLAND = 6

# Developer-only code that is never reachable in play; its inserts would duplicate real ones.
[g2nk.exclude_functions]
ADDONWORLD = ["USEJOLY*"]

# Package slug and Polish name per ZEN (names are the established ones).
[g2nk.worlds.NEWWORLD]
slug = "khorinis"
name_pl = "Khorinis"
[g2nk.worlds.OLDWORLD]
slug = "gornicza-dolina"
name_pl = "Górnicza Dolina"
[g2nk.worlds.ADDONWORLD]
slug = "jarkendar"
name_pl = "Jarkendar"
[g2nk.worlds.DRAGONISLAND]
slug = "irdorath"
name_pl = "Irdorath"

[g1]
root = "Gothic"
version = "GOTHIC1"
vdf_glob = "Data/*.vdf"
vdf_exclude = ["Speech*", "sound*"]
script_dat = "_work/DATA/scripts/_compiled/Gothic.dat"
anchor = { lon = 0.0, lat = 0.0, h = 0.0 }
chapter_dispatcher = "B_KAPITELWECHSEL"

# ZenKit sets the polygon LOD flag on ~96 % of the G1 world mesh (G2: none), which would drop almost all geometry.
skip_lod_polygons = false

# G1 has no B_ENTER_*: every world has STARTUP_<ZEN> / INIT_<ZEN> and the Colony's camps are sub-startups of STARTUP_WORLD.
# STARTUP_WORLD_ORCS / STARTUP_WORLD_DEMO / STARTUP_AI_TESTLEVEL* are not wired to any world and stay out.
[g1.world_roots]
WORLD = ["STARTUP_WORLD", "INIT_WORLD"]
FREEMINE = ["STARTUP_FREEMINE", "INIT_FREEMINE"]
OLDMINE = ["STARTUP_OLDMINE", "INIT_OLDMINE"]
ORCGRAVEYARD = ["STARTUP_ORCGRAVEYARD", "INIT_ORCGRAVEYARD"]
ORCTEMPEL = ["STARTUP_ORCTEMPEL", "INIT_ORCTEMPEL"]

# No [g1.first_chapter]: the scripts do not tie the first entry into the mines, the graveyard or the temple to a
# chapter (those inserts are triggered from dialogs), so their startup inserts keep chapter = null.

# Package slug and Polish name per ZEN. The game has no names for the worlds; all names are working names.
[g1.worlds.WORLD]
slug = "kolonia"
name_pl = "Kolonia Karna"
provisional_name = true
[g1.worlds.FREEMINE]
slug = "wolna-kopalnia"
name_pl = "Wolna Kopalnia"
provisional_name = true
[g1.worlds.OLDMINE]
slug = "stara-kopalnia"
name_pl = "Stara Kopalnia"
provisional_name = true
[g1.worlds.ORCGRAVEYARD]
slug = "cmentarzysko-orkow"
name_pl = "Cmentarzysko orków"
provisional_name = true
[g1.worlds.ORCTEMPEL]
slug = "swiatynia-orkow"
name_pl = "Świątynia orków"
provisional_name = true

[g3]
engine = "genome"
root = "Gothic 3"
# All archives and their patches (X.pak < X.p00 < X.p01); audio is not needed.
pak_glob = "Data/*.p*"
pak_exclude = ["Speech_*", "Music*", "Sound*"]
anchor = { lon = 0.0, lat = 0.0, h = 0.0 }
# Developer test sectors; some are enabled (=true) in G3_World_01.wrldatasc but are not part of the game.
sector_exclude = ["*Test*", "BjoernTest_*", "Hoshi_*", "Mario_*", "Mattes_*"]
# Sectors =false in the world file are story scenes the quests switch on (Geldern mine states, Kalan's orcs,
# the white shadowbeast, blessed fire mage cups…). Included and marked as story content (user decision 2026-10-26).
include_disabled_sectors = true

# G3 stores only the points (work / relax / sleep); the hours live in the game code.
# Working values, to be confirmed in the game. Separator is the en dash "–" (geoportal.DASH).
[g3.routine_slots]
work = ["08:00–18:00"]
relax = ["18:00–22:00"]
sleep = ["22:00–08:00"]

# The whole continent (Myrtana, Nordmar, Varant) is one world file. Working name.
[g3.worlds.G3_WORLD_01]
slug = "myrtana"
name_pl = "Myrtana"
provisional_name = true
