# Names and kinds of locations (locations.json). Everything here is OUR mapping, not text of the game:
# the games name zones with internal codes (oCZoneMusic: OLDCAMP_OC, NEWCAMP_NCI, ...). Every entry with `name`
# becomes name_source = "derived" and has to be approved by the user; an entry without `name` keeps the code as
# the name (name_source = "code") and only fixes the kind. `alias` merges the zone into another base name.
# Zone base name = part before the first "_" without trailing digits (ARCHOLOS2_CIT -> ARCHOLOS).
# G3 names are taken from the game (stringtable.ini: GO_Enclave_*, MAP_World_*); only what the game lacks is here.

